<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastelería Delicia</title>

  <!-- CSS de Bootstrap 6 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
        crossorigin="anonymous">

  <!-- Estilos personalizados -->
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar md:navbar-expand border-bottom bg-body">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">🍰 Pastelería Delicia</a>
      
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-solid theme-primary position-relative" data-bs-toggle="drawer" data-bs-target="#drawerCarrito">
          🛒 Carrito
          <span id="badgeContador" class="badge bg-white text-dark position-absolute top-0 start-100 translate-middle rounded-pill">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Encabezado / Hero -->
  <header class="py-9 bg-light text-center">
    <div class="container">
      <h1 class="fs-4xl fw-bold">Nuestros Postres Artesanales</h1>
      <p class="fg-secondary">Elige tus favoritos y ordénalos en línea al instante.</p>
    </div>
  </header>

  <!-- Catálogo de Productos -->
  <main class="container py-9">
    <div class="row row-cols-1 md:row-cols-2 lg:row-cols-3 g-7" id="contenedorProductos">
      <!-- Los productos se cargarán dinámicamente con JS -->
    </div>
  </main>

  <!-- Drawer (Menú lateral del Carrito) -->
  <dialog class="drawer drawer-end" id="drawerCarrito">
    <div class="drawer-header border-bottom">
      <h5 class="drawer-title">Tu Carrito de Compras</h5>
      <button class="btn-close" data-bs-dismiss="drawer" aria-label="Cerrar"></button>
    </div>
    <div class="drawer-body">
      <ul class="list-group list-group-flush mb-4" id="listaCarrito">
        <!-- Ítems del carrito -->
      </ul>
      <div class="border-top pt-3">
        <div class="d-flex justify-content-between fs-lg fw-bold mb-3">
          <span>Total:</span>
          <span id="totalCarrito">S/ 0.00</span>
        </div>
        <button class="btn btn-solid theme-primary w-100">Procesar Pedido</button>
      </div>
    </div>
  </dialog>

  <!-- JavaScript Módulo de Bootstrap 6 y Lógica local -->
  <script type="module"
          src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
          crossorigin="anonymous"></script>

  <script type="module" src="js/tienda.js"></script>
</body>
</html>
